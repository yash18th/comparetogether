services:
  - type: web
    name: foodcompare-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SWIGGY_MCP_BASE_URL
        value: https://mcp.swiggy.com
